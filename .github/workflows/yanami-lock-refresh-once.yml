name: Yanami Lockfile Refresh Once

on:
  push:
    branches: [feat/yanami-workbench-ui]
    paths:
      - '.github/workflows/yanami-lock-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(yanami): refresh lockfile helper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Resolve workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit only the resolved lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(yanami): sync workspace lockfile'
          git push origin HEAD:feat/yanami-workbench-ui
