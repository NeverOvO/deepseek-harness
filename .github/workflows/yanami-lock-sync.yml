name: Yanami Lockfile Sync

on:
  push:
    branches:
      - feat/yanami-workbench-ui
    paths:
      - '.github/workflows/yanami-lock-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: sync pnpm lockfile for Yanami desktop'
          git push origin HEAD:feat/yanami-workbench-ui
