name: Yanami Refresh Lockfile

on:
  push:
    branches: [feat/yanami-workbench-ui]
    paths:
      - '.github/workflows/yanami-refresh-lock.yml'

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  refresh-lockfile:
    name: Refresh pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Resolve workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit resolved lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(lock): sync packaged CLI runtime peers'
          git push origin HEAD:feat/yanami-workbench-ui
