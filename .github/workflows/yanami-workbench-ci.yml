name: Yanami Workbench CI

on:
  push:
    branches:
      - feat/yanami-workbench-ui
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/config/agent-presets/**'
      - 'packages/bundle/web-app/**'
      - 'packages/client/ui-conversation/**'
      - 'packages/client/ui-workspace/**'
      - 'packages/client/ui-theme/**'
      - 'packages/plan/plan-mode/**'
      - 'packages/goal/**'
      - 'packages/workspace/**'
      - 'packages/core/**'
      - 'packages/llm/**'
      - 'packages/compaction/**'
      - 'packages/context/**'
      - 'packages/bundle/base/**'
      - 'packages/bundle/headless/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/yanami-workbench-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yanami-workbench-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  workbench:
    name: Workbench / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Yanami is an upper-layer plugin/product shell. The model provider,
      # routing/loop, prompt registry, tool registry, context/compaction core,
      # base bundles, and shipped DSH Agent presets remain upstream-owned.
      - name: Verify Yanami stays above the DSH model core
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin +master:refs/remotes/origin/master
          protected_paths=(
            apps/cli/config/agent-presets
            packages/llm
            packages/core/agent
            packages/core/agent-loop
            packages/core/agent-default-model
            packages/core/agent-tool-presentation
            packages/core/system-prompt
            packages/core/tools
            packages/compaction
            packages/context
            packages/bundle/base
            packages/bundle/headless
          )

          if ! git diff --quiet origin/master HEAD -- "${protected_paths[@]}"; then
            echo '::error::Yanami must not modify the upstream DSH model/agent core or shipped Agent presets. Sync master and keep Yanami changes in upper-layer plugin seams.'
            git diff --name-status origin/master HEAD -- "${protected_paths[@]}"
            exit 1
          fi

          if grep -Eq '^[[:space:]]*-[[:space:]]+id:[[:space:]]+agent-default-model([[:space:]]|$)' packages/bundle/web-app/cordis.patch.yml; then
            echo '::error::Yanami web overlay must not override the upstream agent-default-model row.'
            exit 1
          fi
          if grep -q '@deepseek-ai/dsh-llm-deepseek' packages/bundle/web-app/cordis.patch.yml; then
            echo '::error::Yanami web overlay must not mount or replace the DeepSeek provider directly.'
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Test Yanami Workbench surfaces
        run: >-
          pnpm exec vitest run
          packages/bundle/web-app/tests/harness-mode.spec.ts
          packages/bundle/web-app/tests/yanami-mode.spec.ts
          packages/bundle/web-app/tests/project-memory-context.spec.ts
          packages/bundle/web-app/tests/project-memory-proposal.spec.ts
          packages/bundle/web-app/tests/project-memory-consolidation.spec.ts
          packages/workspace/workspace/tests/project-memory-consolidation.spec.ts
          packages/client/ui-workspace/tests/project-memory-header.client.spec.tsx
          packages/client/ui-workspace/tests/project-memory-consolidation-header.client.spec.tsx
          packages/client/ui-conversation/tests/yanami-home.client.spec.tsx
          packages/plan/plan-mode/tests

      - name: Build repository
        run: pnpm run build

      - name: Verify package constraints
        run: pnpm run constraints
