<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>八奈见工作台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      background: #f6fbff;
      color: #244b75;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 220, 108, .24), transparent 25%),
        radial-gradient(circle at 18% 80%, rgba(112, 203, 190, .16), transparent 30%),
        linear-gradient(145deg, #eef9ff 0%, #fbfdff 48%, #f2faf7 100%);
    }
    .window {
      position: relative;
      width: min(760px, calc(100vw - 72px));
      padding: 58px 64px 48px;
      border: 1px solid rgba(65, 121, 173, .16);
      border-radius: 32px;
      background: rgba(255, 255, 255, .68);
      box-shadow: 0 28px 80px rgba(58, 105, 148, .14);
      backdrop-filter: blur(22px) saturate(1.12);
      -webkit-backdrop-filter: blur(22px) saturate(1.12);
    }
    .spark {
      position: absolute;
      top: 34px;
      right: 42px;
      color: #efbd43;
      font-size: 28px;
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .brand { display: flex; align-items: center; gap: 20px; }
    .mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border-radius: 26px;
      color: white;
      font-size: 32px;
      font-weight: 760;
      background: linear-gradient(145deg, #2c5e98, #4d91df);
      box-shadow: 0 14px 30px rgba(51, 105, 167, .24);
    }
    .mark::after {
      content: "";
      position: absolute;
      right: -7px;
      bottom: 8px;
      width: 22px;
      height: 22px;
      border: 4px solid #fff7d8;
      border-radius: 50%;
      background: #f5c650;
      box-shadow: 0 4px 12px rgba(208, 156, 43, .22);
    }
    h1 { margin: 0; font-size: 31px; letter-spacing: -.4px; font-weight: 720; }
    .en { margin-top: 5px; color: #7592af; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .copy { margin: 40px 0 0; color: #56789b; font-size: 15px; line-height: 1.8; }
    .status { margin-top: 38px; display: flex; align-items: center; gap: 12px; color: #6686a5; font-size: 13px; }
    .dots { display: inline-flex; gap: 5px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: #4d91df;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .16s; }
    .dots i:nth-child(3) { animation-delay: .32s; background: #f1bd43; }
    .line {
      position: relative;
      height: 3px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 100px;
      background: rgba(69, 127, 184, .08);
    }
    .line::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 36%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4e91df, #7cc9ba, #f2c45a);
      animation: travel 1.7s ease-in-out infinite;
    }
    .foot { margin-top: 24px; color: #94a9bc; font-size: 12px; }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
    @keyframes travel { 0% { transform: translateX(-105%); } 70%, 100% { transform: translateX(280%); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: rotate(0deg) scale(.9); } 50% { opacity: 1; transform: rotate(18deg) scale(1.1); } }
  </style>
</head>
<body>
  <main class="window">
    <div class="spark">✦</div>
    <div class="brand">
      <div class="mark">八</div>
      <div>
        <h1>八奈见工作台</h1>
        <div class="en">Yanami Workbench</div>
      </div>
    </div>
    <p class="copy">正在准备今天的工作环境。项目、会话、工具和 DSH Runtime 会在后台自动连接，不需要另外打开终端或浏览器。</p>
    <div class="status">
      <span class="dots"><i></i><i></i><i></i></span>
      <span>正在启动 DSH Runtime…</span>
    </div>
    <div class="line"></div>
    <div class="foot">复杂的问题，也可以拆成简单的阶段。</div>
  </main>
</body>
</html>
